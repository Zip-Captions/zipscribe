if" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="start" fill-opacity="1">Translation — French</text><rect x="330" y="289" width="54.400000000000006" height="18" rx="9" fill="rgba(76,141,255,.14)" stroke="#2a2f38" stroke-width="1"/><text x="357.2" y="302" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4c8dff" text-anchor="middle" fill-opacity="1">edited</text><circle cx="123" cy="317" r="7" fill="#0d0f12" stroke="#2a2f38" stroke-width="1"/><text x="137" y="321" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="start" fill-opacity="1">Translation — Spanish</text><rect x="332" y="311" width="48" height="18" rx="9" fill="#232830" stroke="#2a2f38" stroke-width="1"/><text x="356" y="324" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#d9a03f" text-anchor="middle" fill-opacity="1">stale</text><line x1="80" y1="396" x2="640" y2="396" stroke="#2a2f38" stroke-width="1"/><rect x="524" y="410" width="96" height="28" rx="4" fill="#4c8dff" stroke="#2a2f38" stroke-width="1"/><text x="572" y="428" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" fill-opacity="1">Export</text><rect x="416" y="410" width="96" height="28" rx="4" fill="none" stroke="none" stroke-width="1"/><text x="464" y="428" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="middle" fill-opacity="1">Cancel</text><text x="100" y="428" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">Files never leave this device.</text>
