<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="Export in progress — &quot;edits after start are not included&quot; messaging">
<title>Export in progress — &quot;edits after start are not included&quot; messaging</title>
<rect width="720" height="480" fill="#0d0f12"/>
<rect width="720" height="480" fill="#0d0f12"/><rect width="720" height="480" fill="#000" fill-opacity=".45"/><rect x="80" y="30" width="560" height="340" rx="6" fill="#15181d" stroke="#2a2f38" stroke-width="1"/><text x="100" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8eaed" text-anchor="start" fill-opacity="1">Exporting…</text><line x1="80" y1="74" x2="640" y2="74" stroke="#2a2f38"/><text x="108" y="96" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">This run uses the project snapshot taken when you pressed Export.</text><rect x="108" y="110" width="504" height="58" rx="6" fill="#1c2027" stroke="#2a2f38" stroke-width="1"/><rect x="124" y="126" width="22.4" height="18" rx="9" fill="rgba(76,141,255,.14)" stroke="#2a2f38" stroke-width="1"/><text x="135.2" y="139" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4c8dff" text-anchor="middle" fill-opacity="1">i</text><text x="150" y="134" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#e8eaed" text-anchor="start" fill-opacity="1">Your edits stay live — they will not change the file being written.</text><text x="150" y="152" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">Want them in? Cancel and export again after you finish editing.</text><rect x="108" y="182" width="504" height="10" rx="5" fill="#232830" stroke="none" stroke-width="1"/><rect x="108" y="182" width="342.72" height="10" rx="5" fill="#4c8dff"/><line x1="80" y1="396" x2="640" y2="396" stroke="#2a2f38" stroke-width="1"/><rect x="524" y="410" width="96" height="28" rx="4" fill="#4c8dff" stroke="#2a2f38" stroke-width="1"/><text x="572" y="428" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" fill-opacity="1">Cancel export</text><rect x="416" y="410" width="96" height="28" rx="4" fill="none" stroke="none" stroke-width="1"/><text x="464" y="428" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="middle" fill-opacity="1">Cancel</text>
</svg>
