<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="Export dialog — track and language selection with stale/edited badges">
<title>Export dialog — track and language selection with stale/edited badges</title>
<rect width="720" height="480" fill="#0d0f12"/>
<rect width="720" height="480" fill="#0d0f12"/><rect width="720" height="480" fill="#000" fill-opacity=".45"/><rect x="80" y="30" width="560" height="360" rx="6" fill="#15181d" stroke="#2a2f38" stroke-width="1"/><text x="100" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8eaed" text-anchor="start" fill-opacity="1">Export</text><line x1="80" y1="74" x2="640" y2="74" stroke="#2a2f38"/><text x="108" y="94" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8eaed" text-anchor="start" fill-opacity="1">Track</text><circle cx="123" cy="111" r="7" fill="#0d0f12" stroke="#2a2f38" stroke-width="1"/><text x="137" y="115" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="start" fill-opacity="1">Source — English (128 blocks)</text><circle cx="123" cy="133" r="7" fill="#0d0f12" stroke="#4c8dff" stroke-width="2"/><circle cx="123" cy="133" r="3" fill="#4c8dff"/><text x="137" y="137" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="start" fill-opacity="1">Translation — French</text><rect x="330" y="127" width="54.400000000000006" height="18" rx="9" fill="rgba(76,141,255,.14)" stroke="#2a2f38" stroke-width="1"/><text x="357.2" y="140" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4c8dff" text-anchor="middle" fill-opacity="1">edited</text><circle cx="123" cy="155" r="7" fill="#0d0f12" stroke="#2a2f38" stroke-width="1"/><text x="137" y="159" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="start" fill-opacity="1">Translation — Spanish</text><rect x="332" y="149" width="48" height="18" rx="9" fill="#232830" stroke="#2a2f38" stroke-width="1"/><text x="356" y="162" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#d9a03f" text-anchor="middle" fill-opacity="1">stale</text><text x="108" y="180" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">One track per export run; each selected sidecar is written for the selected track only.</text><text x="108" y="198" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">&quot;stale&quot; = source text changed since translation; a re-translate link sits beside the chip.</text><line x1="80" y1="218" x2="640" y2="218" stroke="#2a2f38" stroke-width="1"/><line x1="80" y1="396" x2="640" y2="396" stroke="#2a2f38" stroke-width="1"/><rect x="524" y="410" width="96" height="28" rx="4" fill="#4c8dff" stroke="#2a2f38" stroke-width="1"/><text x="572" y="428" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" fill-opacity="1">Export</text><rect x="416" y="410" width="96" height="28" rx="4" fill="none" stroke="none" stroke-width="1"/><text x="464" y="428" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="middle" fill-opacity="1">Cancel</text>
