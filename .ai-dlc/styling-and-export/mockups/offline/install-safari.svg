t-size="11" font-weight="400" fill="#e8eaed" text-anchor="start" fill-opacity="1">About</text><rect x="360" y="40" width="300" height="150" rx="6" fill="#232830" stroke="#2a2f38" stroke-width="1"/><text x="376" y="64" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8eaed" text-anchor="start" fill-opacity="1">Add to Dock (Safari)</text><text x="376" y="84" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">1.  Share menu  ⎋  in the toolbar</text><text x="376" y="102" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">2.  &quot;Add to Dock&quot;</text><text x="376" y="120" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">3.  Name it &quot;Zipscribe&quot;  →  Add</text><text x="376" y="146" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5c6470" text-anchor="start" fill-opacity="1">No native prompt exists on Safari — we show steps, never a fake button.</text><text x="20" y="200" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#9aa2ad" text-anchor="start" fill-opacity="1">Menu label is &quot;Add to Home Screen&quot; on iOS.</text>
