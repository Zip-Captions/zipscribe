<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-label="Installed PWA opening a file from the OS routes into the import drop zone">
<title>Installed PWA opening a file from the OS routes into the import drop zone</title>
<rect width="720" height="430" fill="#0d0f12"/>
<rect x="40" y="30" width="640" height="380" rx="6" fill="#15181d" stroke="#2a2f38" stroke-width="1"/><rect x="120" y="90" width="480" height="220" rx="10" fill="#0d0f12" stroke="#4c8dff" stroke-width="2" stroke-dasharray="8 6"/><text x="360" y="190" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e8eaed" text-anchor="middle" fill-opacity="1">Drop media or captions here</text><text x="360" y="214" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa2ad" text-anchor="middle" fill-opacity="1">…or files opened from the OS land in this same flow</text><rect x="250" y="240" width="220" height="44" rx="6" fill="#1c2027" stroke="#4c8dff" stroke-width="1"/><text x="266" y="258" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="400" fill="#e8eaed" text-anchor="start" fill-opacity="1">speech-2min.m4a</text><text x="266" y="274" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#5c6470" text-anchor="start" fill-opacity="1">opened via &quot;Open with Zipscribe&quot;</text><text x="120" y="344" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#5c6470" text-anchor="start" fill-opacity="1">file_handlers in the manifest register media + .zipscribe.json; no import dialog differs from drag-and-drop.</text>
</svg>
