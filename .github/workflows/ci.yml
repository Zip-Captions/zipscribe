name: ci

# PR pipeline (knowledge/conventions.md § CI/CD): install → L0 (lint,
# typecheck, spec-lint, license-check) → test prerequisites (playwright
# browsers, models:fetch cached by registry hash — both BEFORE vitest so the
# suite runs against the real environment, not a vacuously-degraded one) →
# L1–L3 (vitest + enforced coverage thresholds) → build + budgets → L4–L5
# Playwright → verify:unit for the changed unit → artifacts (incl. dist/,
# which preview-deploy ships unchanged — "the deploy job ships the exact
# dist/ artifact the same run tested"). The preview deploy + L7 smoke run
# only when the Cloudflare secrets exist (unit-01 ships the workflows; owner
# adds repo-level secrets — see unit report).

on:
  pull_request:
    branches:
      - develop
      - main
      - release/*
      - release/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: L0 — lint
        run: corepack pnpm lint
      - name: L0 — typecheck
        run: corepack pnpm typecheck
      - name: L0 — spec lint (criteria IDs, depends_on, frontmatter)
        run: corepack pnpm spec-lint
      - name: L0 — dependency license check
        run: corepack pnpm license-check
      - name: L0 — formatting
        run: corepack pnpm format:check
      - name: install playwright browsers
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: 'models (CI tier: tiny + VAD, checksum-verified)'
        uses: actions/cache@v4
        id: models-cache
        with:
          path: .cache/models
          key: "models-${{ hashFiles('models/ci-registry.json') }}"
      - run: corepack pnpm models:fetch
        if: steps.models-cache.outputs.cache-hit != 'true'
      - name: L1–L3 — unit tests with coverage thresholds
        run: corepack pnpm test --coverage
      - name: build
        run: corepack pnpm build
      - name: bundle budget
        run: corepack pnpm check-bundle
      - name: upload gated dist (preview-deploy ships this exact artifact)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 1
      - name: perf fixture (CC-04.9 memory-gate input, deterministic, ~30 s)
        # fixtures/audio-120min.mp4 is generated + gitignored (never
        # committed). The frozen memory spec skips when absent, but CC-04.9
        # is an UNTAGGED criterion: verify:unit must see a real passing
        # playwright case (unit-04 CI run 41154282863: absent fixture →
        # skip → UNCOVERED → exit 1). `--perf` regenerates the corpus
        # deterministically and self-checks the perf input structurally
        # (7200 ±1 s + size envelope; bytes cross-platform, see
        # make-fixtures perf block); direct node call because the
        # `pnpm fixtures --perf` wrapper swallows the flag (unit-04 report
        # Deviations §3).
        run: corepack pnpm exec node scripts/make-fixtures.ts --perf
      # Unit-05 CI split (documented follow-up firing; gh run 41483128610):
      # one `pnpm test:e2e` ran chromium+memory together, so the frozen
      # e2e/asr/longtask.spec.ts transcribed the FULL perf fixture on the
      # 2-core runner (wasm T2, numThreads=1; measured CI RTF ≫ 0.29) and
      # burned two 35-min timeouts — the step died at 1 h 19 m. Doctrine
      # (unit-05 verify note): "if it outgrows this window the slow legs
      # belong in the qualify/release flow, not a longer spawn" — so instead
      # of growing budgets, the perf fixture is scoped to the phase that
      # needs it. memory first WITH the fixture (CC-04.9's 120-min DECODE is
      # fast — decode-only, plus unit-05's recycle-10min), then the fixture
      # is removed, then chromium: longtask then takes its own authored
      # fallback path (speech-10min.mp4, ≤ 4 runs until a ≥ 60 s window,
      # 25-min timeout — longtask.spec.ts lines 34/56), which fits the CI
      # runner; everything else in chromium is fixture-independent. This
      # split is CI-only structure: non-CI reference-hardware runs keep the
      # combined `pnpm test:e2e` sweep with full perf-fixture coverage. Each
      # phase boots the root 4310 preview (the extra build is the cost of the
      # split, ~1 min), and both phases run through playwright.config.ts, so
      # CI retries:1 + the retry-pass flake reporter stay exactly as set.
      - name: L4–L5 — Playwright memory phase (perf fixture present)
        run: corepack pnpm exec playwright test --project=memory
      - name: drop perf fixture for the chromium phase
        # Generated + gitignored (regenerable, `pnpm fixtures --perf`).
        # verify:unit re-provisions it itself before its CI memory phase
        # (scripts/verify-criteria.ts CI branch — CC-04.9 skips without it
        # → UNCOVERED → exit 1, unit-04 precedent).
        run: rm -f fixtures/audio-120min.mp4
      - name: L4–L5 — Playwright chromium phase (longtask fallback path)
        run: corepack pnpm exec playwright test --project=chromium
      - name: criteria traceability (unit branch)
        run: corepack pnpm verify:unit --from-branch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            coverage/
            coverage-main/
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore

  fixtures-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: regenerate committed fixtures + checksum/license verification
        run: |
          corepack pnpm fixtures
          corepack pnpm fixtures:verify

  preview-deploy:
    # FR-1.0.13 (Adaptation 3: deferred until the owner adds repo-level
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID; then every PR deploys a
    # preview and the smoke runs against it).
    needs: quality
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      # Ship the exact artifact the quality job gated — no rebuild here
      # (conventions § CI/CD: "the deploy job ships the exact dist/ artifact
      # that the same run tested").
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: fetch criteria reports (for the PR comment)
        uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
      - name: deploy PR preview (skips without Cloudflare secrets)
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          corepack pnpm exec wrangler pages deploy dist --project-name zipscribe --branch "${{ github.head_ref }}" | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+pages\.dev' deploy.log | tail -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
      - name: minimal deploy smoke
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: corepack pnpm exec node scripts/deploy-smoke.mjs "${{ steps.deploy.outputs.url }}"
      - name: PR comment — preview URL + criteria table (FR-1.0.7 / FR-1.0.13)
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.url }}'
          TABLE=$(ls reports/criteria/*.md 2>/dev/null | head -1 || true)
          if [ -n "${TABLE:-}" ]; then
            BODY="**Preview:** ${URL}"$'\n\n'"$(cat "${TABLE}")"
          else
            BODY="**Preview:** ${URL} (criteria table in the run's \`reports\` artifact)"
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "$BODY"
