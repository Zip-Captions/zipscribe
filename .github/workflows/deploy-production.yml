name: deploy-production

# A push to main only ever comes from merging a release/* (or hotfix/*) PR —
# branch-policy.yml is the guard. On that push: full CI → deploy production
# (`<project>.pages.dev`) → L7 smoke → on success cut the release tag, publish
# the GitHub Release (changelog from conventional commits) and open the
# back-merge PR to develop; on smoke failure redeploy the previous tag and
# block the release. [DEPLOY] CC-01.15/16 stay deferred until Cloudflare
# secrets exist (Adaptation 3); unit-203 hardens the rollback path.

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test --coverage
      - run: corepack pnpm build
      - run: corepack pnpm check-bundle
      - name: install playwright browsers
        run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - name: deploy production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: corepack pnpm exec wrangler pages deploy dist --project-name zipscribe --branch main
      - name: production smoke (app boots, version visible, zero console errors)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: corepack pnpm exec node scripts/deploy-smoke.mjs https://<project>.pages.dev
      - name: compute release tag from package.json version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cut release tag + GitHub Release with generated changelog
        if: success() && startsWith(github.head_ref, '') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} exists; skipping release creation"
            exit 0
          fi
          git config user.name "zipscribe-ci"
          git config user.email "ci@zipscribe.local"
          git tag "${TAG}"
          git push origin "${TAG}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          {
            echo "## Changes since ${PREVIOUS_TAG:-initial}"
            git log --no-merges --pretty='- %s (%h)' "${RANGE}"
          } > release-notes.md
          gh release create "${TAG}" --notes-file release-notes.md
      - name: back-merge release to develop
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="back-merge-main-to-develop-$(date +%s)"
          git config user.name "zipscribe-ci"
          git config user.email "ci@zipscribe.local"
          git checkout -b "${BRANCH}" origin/main
          git push origin "${BRANCH}"
          gh pr create --base develop --head "${BRANCH}" \
            --title "chore: back-merge main into develop after release" \
            --body "Automated back-merge opened by deploy-production after a successful production release." || true
