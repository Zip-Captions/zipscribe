name: deploy-staging

# Push to develop → full CI on the merge commit → deploy staging
# (`develop.<project>.pages.dev`) → L7 smoke (conventions § CI/CD).
# [DEPLOY] criteria CC-01.14 stay deferred until the owner adds the repo-level
# CLOUDFLARE_* secrets (`.agent/overnight-pipeline.md` Adaptation 3).

on:
  push:
    branches:
      - develop

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test --coverage
      - run: corepack pnpm build
      - run: corepack pnpm check-bundle
      - name: install playwright browsers
        run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - name: deploy staging
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: corepack pnpm exec wrangler pages deploy dist --project-name zipscribe --branch develop
      - name: staging smoke (app boots, version visible, zero console errors)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: corepack pnpm exec node scripts/deploy-smoke.mjs https://develop.<project>.pages.dev
